/* BACKGROUND VISIBILITY FIX ONLY.
   Earlier galaxy was so diffuse it disappeared against the page.
   Keep the existing UI, motion effects, colours and scripts intact. */
body::before{
  inset:auto;
  width:min(105vmax,1100px);
  height:min(105vmax,1100px);
  left:57%;

  border-radius:50%;
  transform-origin:50% 50%;
  background:

}

function seededRandom(seed){let t=seed>>>0;return ()=>{t+=0x6D2B79F5;let x=t;x=Math.imul(x^(x>>>15),x|1);x^=x+Math.imul(x^(x>>>7),x|61);return ((x^(x>>>14))>>>0)/4294967296}}
const failureDay=(rel,rng)=>rel>=1?Infinity:Math.max(1,Math.ceil(Math.log(1-rng())/Math.log(rel**(1/REF))));
function simulate(m,d,rng=Math.random,a=evaluate(m,d)){
 const lv=CAT[d.launch],bus=CAT[d.bus],prop=CAT[d.propulsion],pwr=CAT[d.power],com=CAT[d.comms],ins=d.instruments.map(k=>CAT[k]);
 const events=[],explanations=[];
 const fail=reasons=>({outcome:'FAILURE',science:0,science_pct:0,objectives_completed:[],objectives_missed:m.objectives.map(o=>o.name),events,explanations:reasons,score:0,score_breakdown:{}});
 if(!a.feasible){events.push('Design review: mission NOT approved for launch.');return fail([...a.violations]);}
 if(rng()>lv.reliability){events.push('Day 0: launch vehicle anomaly. Spacecraft lost.');return fail([`The ${lv.name} failed during ascent. Try a more reliable launcher.`]);}
 events.push(`Day 0: ${lv.name} lifts off. Nominal ascent.`);
 const fd=Object.fromEntries([bus,pwr,com,prop,...ins].map(c=>[c.key,failureDay(c.reliability,rng)]));
 const first=arr=>arr.reduce((a,b)=>fd[a.key]<=fd[b.key]?a:b);
 const cruiseFail=first([bus,pwr,com,prop]);
 if(fd[cruiseFail.key]<=a.transit_days){events.push(`Day ${fd[cruiseFail.key]}: ${cruiseFail.name} failure during cruise. Spacecraft lost.`);return fail([`${cruiseFail.name} failed before arrival.`]);}
 events.push(`Day ${a.transit_days}: orbit insertion burn complete. Arrived at the ${m.destination}.`);
 const opsFail=first([bus,pwr,com]);const opsEnd=Math.min(m.ops_days,fd[opsFail.key]-a.transit_days);
 if(opsEnd<m.ops_days){events.push(`Day ${a.transit_days+opsEnd}: ${opsFail.name} failure. Contact lost.`);explanations.push(`${opsFail.name} failed after ${opsEnd} science days.`)}
 let science=0;const fractions={};
 for(const c of ins){const days=Math.min(opsEnd,fd[c.key]);if(days<opsEnd){events.push(`Day ${a.transit_days+days}: ${c.name} failed.`);explanations.push(`${c.name} failed after ${days} science days.`)}const frac=a.instrument_duty*a.data_fraction*days/m.ops_days;fractions[c.key]=frac;science+=c.science*frac;}
 if(opsEnd===m.ops_days)events.push(`Day ${a.total_days}: primary mission complete.`);
 const done=[],missed=[];
 for(const o of m.objectives){const vals=ins.filter(c=>c.tags.includes(o.tag)).map(c=>fractions[c.key]);if(vals.length&&Math.max(...vals)>=THRESHOLD)done.push(o.name);else missed.push(o.name)}
 explanations.unshift(...a.warnings);
 const outcome=done.length>=m.required_objectives?'SUCCESS':done.length?'PARTIAL SUCCESS':'FAILURE';
 if(outcome!=='SUCCESS')explanations.push(`Completed ${done.length} of ${m.required_objectives} required objectives.`);
 const scored=scoreMission(m,a,science,done.length);
 return {outcome,science,science_pct:science/m.science_target,objectives_completed:done,objectives_missed:missed,events,explanations,score:scored.score,score_breakdown:scored.breakdown};
}
function successRate(m,d,runs=300,seed=0){const rng=seededRandom(seed),a=evaluate(m,d);if(!a.feasible)return 0;let wins=0;for(let i=0;i<runs;i++)if(simulate(m,d,rng,a).outcome==='SUCCESS')wins++;return wins/runs;}
function optimise(m,limit=6){const keys=cat=>catalogue.filter(c=>c.category===cat).map(c=>c.key),ins=keys('instrument'),results=[];
 // Exact exhaustive search over the original component catalogue, capped to a few thousand feasible designs in memory.
 for(const launch of keys('launch'))for(const bus of keys('bus'))for(const propulsion of keys('propulsion'))for(const power of keys('power'))for(const comms of keys('comms')){
 for(let mask=1;mask<(1<<ins.length);mask++){
 const instruments=ins.filter((_,i)=>mask&(1<<i));if(instruments.length>CAT[bus].max_instruments)continue;
 const d={launch,bus,propulsion,power,comms,instruments},a=evaluate(m,d);
 if(a.feasible&&a.objectives_achievable.length>=m.required_objectives)results.push({design:d,assessment:a});
 }}
 results.sort((x,y)=>y.assessment.nominal_science-x.assessment.nominal_science||x.assessment.total_cost-y.assessment.total_cost);
 return results.slice(0,limit);
}

function results(){screen='results';const r=result,a=assessment;const color=r.outcome==='SUCCESS'?'result-success':r.outcome==='FAILURE'?'result-failure':'result-partial';render(`<div class="topline">${btn('← DESIGNER','designer')}<span class="step">05 / MISSION DEBRIEF</span></div><div class="eyebrow">Post-flight analysis</div><h1 class="${color}">${r.outcome}</h1><div class="grid2"><div class="panel"><div class="eyebrow">Mission score</div><div class="score">${fmt(r.score,1)}<small> / 100</small></div><p class="muted">Science returned: ${fmt(r.science,1)} / ${mission.science_target} points<br>Objectives completed: ${r.objectives_completed.length} / ${mission.required_objectives} required</p>${Object.entries(r.score_breakdown).map(([k,v])=>`<div class="barrow"><span>${safe(k)}</span><div class="meter"><i style="width:${v}%"></i></div><strong>${v}</strong></div>`).join('')}<div class="actions">${btn('RETRY FLIGHT','retry','primary')}${btn('REDESIGN','designer')}</div></div><div class="panel"><h3>SCIENCE OBJECTIVES</h3>${mission.objectives.map(o=>`<div class="status ${r.objectives_completed.includes(o.name)?'':'warn'}">${r.objectives_completed.includes(o.name)?'✓':'○'} ${safe(o.name)}</div>`).join('')}<h3>ENGINEERING ANALYSIS</h3>${r.explanations.length?r.explanations.map(v=>`<div class="event">${safe(v)}</div>`).join(''):'<p class="muted">No major issues detected in this flight.</p>'}<p class="note">Predicted critical-system survival: ${(a.survival_probability*100).toFixed(1)}% (not a guarantee of mission success).</p></div></div><div class="panel" style="margin-top:16px"><h3>EVENT LOG</h3>${r.events.map(e=>`<div class="event">${safe(e)}</div>`).join('')}</div>`)}

async function loadGallery(topic){const area=document.querySelector('#mv-gallery-content');if(!area)return;area.innerHTML='<p class="muted">Retrieving NASA image records…</p>';try{const q=nasaGalleryTopics[topic][1];const response=await fetch('https://images-api.nasa.gov/search?q='+encodeURIComponent(q)+'&media_type=image&page_size=30');if(!response.ok)throw Error('NASA image service returned '+response.status);const json=await response.json();if(screen!=='gallery'||topic!==nasaGalleryTopic)return;const items=(json.collection?.items||[]).filter(item=>item.links?.some(link=>link.href?.startsWith('https://'))&&item.data?.[0]?.nasa_id).slice(0,18);if(!items.length)throw Error('No photographs were returned for this category');area.innerHTML=`<div class="mv-gallery-grid">${items.map(item=>{const d=item.data[0],img=item.links.find(link=>link.rel==='preview')||item.links[0];const title=safe(d.title||'NASA photograph');const credit=safe(d.photographer||d.secondary_creator||d.center||'NASA');const date=d.date_created?new Date(d.date_created).getUTCFullYear():'';const desc=safe((d.description_508||d.description||'Explore the original NASA archive entry for details.').replace(/<[^>]*>/g,'').slice(0,200));const link='https://images.nasa.gov/details/'+encodeURIComponent(d.nasa_id);return `<article class="mv-gallery-card"><a href="${link}" target="_blank" rel="noopener noreferrer" aria-label="Open NASA archive record for ${title}"><img loading="lazy" src="${safe(img.href)}" alt="${title}" referrerpolicy="no-referrer" onerror="this.closest('.mv-gallery-card').classList.add('mv-image-error')"></a><div class="mv-gallery-meta"><div class="eyebrow">NASA ARCHIVE · ${safe(date)}</div><h3>${title}</h3><p class="muted">${desc}</p><p class="note">SOURCE: ${credit}</p><a href="${link}" target="_blank" rel="noopener noreferrer">VIEW ORIGINAL AT NASA ↗</a></div></article>`}).join('')}</div>`;}catch(err){if(screen!=='gallery'||topic!==nasaGalleryTopic)return;area.innerHTML=`<div class="panel"><h2>NASA IMAGES UNAVAILABLE</h2><p class="muted">The gallery needs an internet connection and access to NASA's image servers. The rest of Mission: Vector still works offline.</p><p class="note">${safe(err.message)}</p><button type="button" data-gallery-retry="1">RETRY CONNECTION</button> <a href="https://images.nasa.gov/" target="_blank" rel="noopener noreferrer">OPEN NASA IMAGE LIBRARY ↗</a></div>`;}}
function arcade(){recordedRun=null;screen='arcade';if(arcadeFrame)cancelAnimationFrame(arcadeFrame);arcadeKeys.clear();const a=evaluate(mission,design);assessment=a;const thruster=CAT[design.propulsion];const shield=design.bus==='bus_large'?4:3;arcadeState={x:140,y:190,vx:0,vy:0,health:shield,points:0,elapsed:0,obstacles:[],pickups:[],last:0,ended:false,started:false,boost:Math.max(1,Math.min(2.2,(thruster.isp_s||250)/250)),fuel:100,seed:17,shots:[],shotCooldown:0,invulnerable:0,asteroidsDestroyed:0};render(`<div class="topline">${btn('← DESIGNER','designer')}<span class="step">04 / FLIGHT OPERATIONS</span></div><div class="eyebrow">Interactive training exercise · Simplified arcade physics</div><h1>MICROMETEOROID RUN</h1><p class="muted">Navigate the spacecraft with WASD or arrow keys. Fire one shot per SPACE press or FIRE tap (0.6s cooldown), collect science coins (gold circles), and protect your hull. After a hit, the craft flashes and gains brief damage immunity. This is an optional training challenge, not a realistic orbital mechanics simulation. Your engineering mission is evaluated separately.</p><div class="arcade-layout"><div class="panel"><canvas id="arcade-canvas" width="900" height="420" tabindex="0" aria-label="Spacecraft piloting challenge"></canvas><div class="arcade-controls">${btn('START TRAINING','startArcade','primary')}${btn('SKIP TRAINING · SIMULATE','launch')}<span class="note">WASD / ARROWS · TAP SPACE TO FIRE (0.6s RECHARGE) · SURVIVE UNTIL HULL REACHES ZERO</span></div><div class="touch-controls"><button data-control="Space">FIRE</button><button data-control="ArrowUp">↑</button><button data-control="ArrowLeft">←</button><button data-control="ArrowDown">↓</button><button data-control="ArrowRight">→</button></div></div><div class="panel arcade-sidebar"><div class="eyebrow">PILOT HUD</div>${pilotPanel()}<div id="arcade-hud" class="arcade-hud">READY FOR FLIGHT</div><h3>Engineering affects control</h3><p class="muted">Your propulsion selection changes handling. Your spacecraft bus determines hull tolerance. Thruster usage consumes the training fuel allowance.</p><div class="fact-ticker"><div class="eyebrow">SCIENCE WHILE YOU FLY</div><div id="arcade-fact">${scienceFacts[0][1]}</div></div><p class="note">Science coins are separate from the original engineering score. This keeps the spacecraft model scientifically transparent.</p></div></div>`);drawArcade();}
function drawArcade(){const c=document.getElementById('arcade-canvas');if(!c||!arcadeState)return;const ctx=c.getContext('2d'),s=arcadeState;ctx.clearRect(0,0,900,420);const bg=ctx.createLinearGradient(0,0,900,420);bg.addColorStop(0,'#071126');bg.addColorStop(1,'#162a43');ctx.fillStyle=bg;ctx.fillRect(0,0,900,420);for(let i=0;i<110;i++){const x=(i*127.13+30)%900,y=(i*79.43+17)%420;ctx.fillStyle=i%4===0?'#8dc4df':'#506782';ctx.fillRect(x,y,i%7===0?2:1,i%7===0?2:1)}ctx.fillStyle='#243c56';ctx.beginPath();ctx.arc(840,440,170,0,7);ctx.fill();ctx.strokeStyle='#708aa0';ctx.stroke();for(const o of s.obstacles){ctx.fillStyle='#8b7e79';ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill();ctx.fillStyle='#b2a29a';ctx.beginPath();ctx.arc(o.x-o.r*.2,o.y-o.r*.2,o.r*.4,0,7);ctx.fill()}for(const shot of s.shots){ctx.save();ctx.shadowColor='#f9b76a';ctx.shadowBlur=12;ctx.fillStyle='#ffe2a1';ctx.fillRect(shot.x,shot.y-2,19,4);ctx.restore()}for(const p of s.pickups){ctx.fillStyle='#f5c76c';ctx.beginPath();ctx.arc(p.x,p.y,10,0,7);ctx.fill();ctx.strokeStyle='#fff1b6';ctx.stroke()}ctx.save();ctx.translate(s.x,s.y);if(s.invulnerable>0&&Math.floor(s.invulnerable*12)%2===0)ctx.globalAlpha=.23;ctx.fillStyle='#d4e8f2';ctx.beginPath();ctx.moveTo(21,0);ctx.lineTo(-18,-13);ctx.lineTo(-12,0);ctx.lineTo(-18,13);ctx.closePath();ctx.fill();ctx.fillStyle='#5dc4e2';ctx.fillRect(-25,-25,12,50);ctx.fillStyle='#e3ae64';ctx.fillRect(13,-10,16,5);ctx.fillRect(13,5,16,5);ctx.fillStyle='#3569a1';ctx.fillRect(-37,-22,12,44);if(s.started&&!s.ended&&(arcadeKeys.size>0)){ctx.fillStyle='#f7a34d';ctx.beginPath();ctx.moveTo(-18,-6);ctx.lineTo(-36-Math.random()*15,0);ctx.lineTo(-18,6);ctx.fill()}ctx.restore();ctx.fillStyle='#b6d6e9';ctx.font='14px monospace';ctx.fillText('MISSION VECTOR // PILOT TRAINING',20,27);if(!s.started){ctx.font='bold 24px system-ui';ctx.fillText('PRESS START TRAINING',280,200)}if(s.ended){ctx.fillStyle='#081321d9';ctx.fillRect(170,140,560,130);ctx.fillStyle='#f2f6ff';ctx.font='bold 27px system-ui';ctx.fillText('HULL DEPLETED',325,187);ctx.font='16px monospace';ctx.fillText('SURVIVAL TIME: '+s.elapsed.toFixed(1)+'s',325,217);ctx.fillText('SCIENCE COINS: '+s.points,325,244)}}
function startArcade(){pilotName=(document.querySelector('#mv-pilot-name')?.value||pilotName).trim().slice(0,24)||'PILOT 1';sessionName=(document.querySelector('#mv-session-name')?.value||sessionName).trim().slice(0,32)||'MISSION NIGHT';if(screen!=='arcade'||!arcadeState||arcadeState.started)return;arcadeState.started=true;arcadeState.last=performance.now();const button=document.querySelector('[data-action="startArcade"]');if(button)button.disabled=true;arcadeFrame=requestAnimationFrame(tickArcade)}
function tickArcade(t){if(screen!=='arcade'||!arcadeState)return;const s=arcadeState;if(s.ended)return;const dt=Math.min(.05,(t-s.last)/1000);s.last=t;s.elapsed+=dt;s.invulnerable=Math.max(0,s.invulnerable-dt);s.shotCooldown=Math.max(0,s.shotCooldown-dt);const x=(arcadeKeys.has('ArrowRight')||arcadeKeys.has('d')?1:0)-(arcadeKeys.has('ArrowLeft')||arcadeKeys.has('a')?1:0),y=(arcadeKeys.has('ArrowDown')||arcadeKeys.has('s')?1:0)-(arcadeKeys.has('ArrowUp')||arcadeKeys.has('w')?1:0);const moving=x||y;if(moving&&s.fuel>0){s.x+=x*220*s.boost*dt;s.y+=y*220*s.boost*dt;s.fuel=Math.max(0,s.fuel-6*dt)}s.x=Math.min(865,Math.max(35,s.x));s.y=Math.min(387,Math.max(33,s.y));if(Math.floor(s.elapsed*2)!==Math.floor((s.elapsed-dt)*2)){const lane=40+Math.random()*335;s.obstacles.push({x:940,y:lane,r:13+Math.random()*16});if(Math.random()<.7)s.pickups.push({x:940,y:40+Math.random()*335})}for(const shot of s.shots)shot.x+=610*dt;
for(const o of s.obstacles){o.x-=175*dt;
 for(const shot of s.shots){if(shot.x>o.x-o.r&&shot.x<o.x+o.r&&Math.abs(shot.y-o.y)<o.r+3){o.x=-100;shot.x=1000;s.asteroidsDestroyed++;break;}}
 if(o.x>=0&&s.invulnerable<=0&&Math.hypot(o.x-s.x,o.y-s.y)<o.r+15){s.health--;s.invulnerable=1.6;o.x=-100;}}
s.shots=s.shots.filter(shot=>shot.x<925);for(const p of s.pickups){p.x-=175*dt;if(Math.hypot(p.x-s.x,p.y-s.y)<23){s.points++;p.x=-100}}s.obstacles=s.obstacles.filter(o=>o.x>-40);s.pickups=s.pickups.filter(p=>p.x>-40);if(s.health<=0){s.ended=true;if(!recordedRun){saveRecord(s);recordedRun=true;const board=document.querySelector('#mv-scoreboard');if(board)board.innerHTML=scoresHTML();}const ctrl=document.querySelector('.arcade-controls');if(ctrl)ctrl.insertAdjacentHTML('beforeend',btn('CONTINUE TO MISSION SIMULATION →','launch','primary'))}const hud=document.querySelector('#arcade-hud');if(hud)hud.innerHTML=`<strong>${s.elapsed.toFixed(1)}s</strong><div>HULL ${'▰'.repeat(Math.max(0,s.health))}${'▱'.repeat(4-Math.min(4,Math.max(0,s.health)))}</div><div>SCIENCE COINS ${s.points}</div><div>ASTEROIDS DESTROYED ${s.asteroidsDestroyed}</div>${s.invulnerable>0?`<div style="color:#d5ac61">HULL PROTECTION ${s.invulnerable.toFixed(1)}s</div>`:""}<div>THRUSTER FUEL ${s.fuel.toFixed(0)}%</div>`;const f=document.querySelector('#arcade-fact');if(f)f.textContent=scienceFacts[Math.floor(s.elapsed/5)%scienceFacts.length][1];drawArcade();if(!s.ended)arcadeFrame=requestAnimationFrame(tickArcade)}
function fireArcadeShot(){const s=arcadeState;if(screen!=='arcade'||!s||!s.started||s.ended||s.shotCooldown>0)return;s.shots.push({x:s.x+32,y:s.y});s.shotCooldown=.6;}
window.addEventListener('keydown',e=>{if(screen==='arcade'&&!e.target.closest('input,textarea,select')&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d',' ','Space'].includes(e.key)){e.preventDefault();if(e.key===' '||e.key==='Space'){if(!e.repeat)fireArcadeShot();}else arcadeKeys.add(e.key)}});

/* Stage 1: optional visual-only action confirmation. Does not alter game state. */
(()=>{
  const labels={missions:'MISSION SELECTOR OPEN',briefing:'MISSION BRIEFING READY',designer:'SPACECRAFT DESIGNER READY',archive:'SCIENCE ARCHIVE OPEN',guide:'FLIGHT GUIDE OPEN',arcade:'FLIGHT TRAINING READY',launch:'SIMULATION INITIATED',optimise:'OPTIMISATION ANALYSIS OPEN',results:'MISSION RESULTS READY',retry:'SIMULATION RESTARTED',home:'RETURNED TO MISSION CONTROL'};
  let activeToast=null,hideTimer=null,removeTimer=null;
  document.addEventListener('click',e=>{
    const control=e.target.closest('[data-action],[data-mission]');
    if(!control||control.disabled)return;
    const msg=control.hasAttribute('data-mission')?'MISSION BRIEFING LOADED':labels[control.dataset.action];
    if(!msg)return;
    if(hideTimer)clearTimeout(hideTimer);
    if(removeTimer)clearTimeout(removeTimer);
    if(activeToast)activeToast.remove();
    const toast=document.createElement('div');toast.className='mv-toast';toast.setAttribute('role','status');toast.textContent='◈  '+msg;
    document.body.appendChild(toast);activeToast=toast;
    hideTimer=setTimeout(()=>{toast.classList.add('mv-toast-out');removeTimer=setTimeout(()=>{toast.remove();if(activeToast===toast)activeToast=null},240)},1800);
  });
})();

 ];
 const shell=document.createElement('aside');shell.id='mv-guide-widget';shell.innerHTML=`<button id="mv-guide-open" aria-expanded="false" type="button">◈ MISSION GUIDE</button><section id="mv-guide-panel" hidden aria-label="Mission guide"><div class="mv-guide-head"><strong>MISSION GUIDE</strong><span>OFFLINE ASSISTANT</span></div><div id="mv-guide-history" role="log" aria-live="polite"><p class="mv-guide-reply">Ask about your spacecraft or how to play.</p></div><form id="mv-guide-form"><input id="mv-guide-input" maxlength="240" placeholder="Ask a mission question…" aria-label="Ask a question" required><button type="submit">SEND</button></form><p class="mv-guide-disclaimer">Built-in guidance, not a live AI chat service.</p></section>`;
 document.body.appendChild(shell);
 const panel=shell.querySelector('#mv-guide-panel'),open=shell.querySelector('#mv-guide-open'),history=shell.querySelector('#mv-guide-history');
 open.addEventListener('click',()=>{panel.hidden=!panel.hidden;open.setAttribute('aria-expanded',String(!panel.hidden));if(!panel.hidden)shell.querySelector('#mv-guide-input').focus()});
 shell.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const input=shell.querySelector('#mv-guide-input'),q=input.value.trim();if(!q)return;const add=(txt,cls)=>{const p=document.createElement('p');p.className=cls;p.textContent=txt;history.appendChild(p)};add(q,'mv-guide-question');const match=faq.find(([re])=>re.test(q));add(match?match[1]:'I can guide you on mass, propulsion, solar power, antennas, science payloads, controls, leaderboards and mission results. Try asking about one of those.', 'mv-guide-reply');input.value='';history.scrollTop=history.scrollHeight});

/* Mission: Vector original procedural audio. No sampled or copyrighted soundtrack. */
(()=> {
'use strict';
const AudioContextClass=window.AudioContext||window.webkitAudioContext;
if(!AudioContextClass)return;
let ctx,master,musicGain,sfxGain,voices=[],playing=false,musicOn=false,sfxOn=true;
let musicVolume=.25,sfxVolume=.35,interval=null,step=0,opened=false,scene='control';
const frequencies=[110,164.81,220,293.66,329.63,440,493.88,587.33];
function init(){
 if(ctx)return;
 ctx=new AudioContextClass();
 master=ctx.createGain();master.gain.value=.8;master.connect(ctx.destination);
 musicGain=ctx.createGain();musicGain.gain.value=0;musicGain.connect(master);
 sfxGain=ctx.createGain();sfxGain.gain.value=sfxVolume;sfxGain.connect(master);
}
function tone(freq,start,duration,volume=.09,wave='sine',dest){
 if(!ctx)return;
 const o=ctx.createOscillator(),g=ctx.createGain();
 o.type=wave;o.frequency.setValueAtTime(freq,start);
 g.gain.setValueAtTime(.0001,start);
 g.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),start+Math.min(.9,duration*.3));
 g.gain.exponentialRampToValueAtTime(.0001,start+duration);
 o.connect(g);g.connect(dest||musicGain);
 o.start(start);o.stop(start+duration+.02);
}

const moods={
 control:{roots:[110,98,130.81,87.31],duration:5.4,interval:4200,pad:.015,lead:.024,bass:.012},
 launch:{roots:[110,130.81,146.83,164.81],duration:3.5,interval:2400,pad:.024,lead:.045,bass:.033},
 space:{roots:[87.31,98,110,130.81],duration:6.8,interval:5200,pad:.019,lead:.030,bass:.015}
};
function phrase(){
 if(!ctx||!musicOn)return;
 const m=moods[scene],now=ctx.currentTime+.05;
 const root=m.roots[Math.floor(step/2)%m.roots.length];
 // All notes are original procedural composition; no recordings or sampled film score.
 [1,1.5,2,2.5].forEach((ratio,i)=>tone(root*ratio,now,m.duration,m.pad/(1+i*.35),'sine'));
 tone(root/2,now,m.duration*.8,m.bass,'triangle');
 tone(root*[2,2.5,3,2.25,3,2.5,2,1.5][step%8],now+.3,m.duration*.65,m.lead,'triangle');
 if(scene==='launch'){
  tone(root*4,now+.5,.45,.022,'triangle');
  tone(root*2,now+1.15,.5,.025,'triangle');
 }
 step++;
}
function setScene(next){
 if(!moods[next]||scene===next)return;
 scene=next;step=0;
 if(musicOn){clearInterval(interval);phrase();interval=setInterval(phrase,moods[scene].interval);}
 updateUI();
}
function startMusic(){
 init();ctx.resume();
 if(musicOn)return;
 musicOn=true;
 musicGain.gain.setTargetAtTime(musicVolume,ctx.currentTime,.8);
 phrase();interval=setInterval(phrase,moods[scene].interval);
 updateUI();
}
function stopMusic(){
 musicOn=false;
 if(interval){clearInterval(interval);interval=null;}
 if(ctx)musicGain.gain.setTargetAtTime(0,ctx.currentTime,.25);
 updateUI();
}
function sound(kind){
 if(!sfxOn)return;
 init();ctx.resume();
 const t=ctx.currentTime+.01;
 if(kind==='launch'){
  tone(130,t,.45,.09,'sawtooth',sfxGain);
  tone(195,t+.16,.5,.055,'triangle',sfxGain);
 }else if(kind==='warning'){
  tone(310,t,.16,.045,'square',sfxGain);
  tone(260,t+.21,.2,.045,'square',sfxGain);
 }else{
  tone(540,t,.075,.025,'sine',sfxGain);
  tone(770,t+.07,.12,.018,'sine',sfxGain);
 }
}
function updateUI(){
 const toggle=document.querySelector('#mv-music-toggle');
 if(toggle){toggle.textContent=musicOn?'♫ MUSIC ON':'♫ MUSIC OFF';toggle.setAttribute('aria-pressed',String(musicOn));}
 const mode=document.querySelector('#mv-audio-mode');if(mode)mode.textContent=({control:'MISSION CONTROL',launch:'LAUNCH SEQUENCE',space:'DEEP SPACE'}[scene]);
 const sfx=document.querySelector('#mv-sfx-toggle');
 if(sfx){sfx.textContent=sfxOn?'SFX ON':'SFX OFF';sfx.setAttribute('aria-pressed',String(sfxOn));}
}
function mount(){
 if(document.querySelector('#mv-audio-controls'))return;
 const panel=document.createElement('aside');
 panel.id='mv-audio-controls';
 panel.setAttribute('aria-label','Audio settings');
 panel.innerHTML=`<button type="button" id="mv-audio-open" aria-expanded="false" aria-controls="mv-audio-panel">♫ AUDIO</button>
 <div id="mv-audio-panel" hidden>
 <div class="mv-audio-title">MISSION AUDIO <span id="mv-audio-mode">MISSION CONTROL</span></div>
 <div class="mv-audio-row"><button type="button" id="mv-music-toggle" aria-pressed="false">♫ MUSIC OFF</button><label>MUSIC <input id="mv-music-volume" type="range" min="0" max="100" value="25" aria-label="Music volume"></label></div>
 <div class="mv-audio-row"><button type="button" id="mv-sfx-toggle" aria-pressed="true">SFX ON</button><label>EFFECTS <input id="mv-sfx-volume" type="range" min="0" max="100" value="35" aria-label="Effects volume"></label></div>
 <p>Music starts only when enabled. Settings are for this session.</p></div>`;
 document.body.appendChild(panel);
 const details=panel.querySelector('#mv-audio-panel');
 panel.querySelector('#mv-audio-open').addEventListener('click',()=>{
  opened=!opened;details.hidden=!opened;panel.querySelector('#mv-audio-open').setAttribute('aria-expanded',String(opened));
 });
 panel.querySelector('#mv-music-toggle').addEventListener('click',()=>musicOn?stopMusic():startMusic());
 panel.querySelector('#mv-sfx-toggle').addEventListener('click',()=>{sfxOn=!sfxOn;updateUI();});
 panel.querySelector('#mv-music-volume').addEventListener('input',e=>{
  musicVolume=Number(e.target.value)/100;
  if(ctx&&musicOn)musicGain.gain.setTargetAtTime(musicVolume,ctx.currentTime,.08);
 });
 panel.querySelector('#mv-sfx-volume').addEventListener('input',e=>{
  sfxVolume=Number(e.target.value)/100;
  if(ctx)sfxGain.gain.setTargetAtTime(sfxVolume,ctx.currentTime,.08);
 });
 // Existing game actions remain untouched. Only augment user-initiated sounds.
 document.addEventListener('click',e=>{
  if(e.target.closest('#mv-audio-controls'))return;
  const b=e.target.closest('button');
  if(!b||b.disabled)return;
  const action=b.dataset.action||'';
  if(action==='launch'||action==='retry')setScene('launch');
  else if(action==='results')setScene('space');
  else if(action==='arcade'||action==='startArcade')setScene('launch');
  else if(action==='home'||action==='missions'||action==='designer'||action==='briefing'||action==='guide'||action==='archive')setScene('control');
  sound(action==='launch'?'launch':action==='results'?'warning':'click');
 },true);
 // Mission selection cards and launch results update the music, not game state.
 document.addEventListener('click',e=>{
  if(e.target.closest('[data-mission]'))setScene('control');
 },true);
 updateUI();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount);
else mount();
document.addEventListener('visibilitychange',()=>{
 if(!ctx)return;
 if(document.hidden)ctx.suspend();
 else if(musicOn)ctx.resume();
});
})();
</script></body></html>
